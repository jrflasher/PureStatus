name: Build Debug APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install SDK packages
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Remove VM-only proxy settings
        run: |
          if [ -f gradle.properties ]; then
            sed -i '/systemProp\..*\.proxy/d' gradle.properties
          fi

      - name: Install fixed debug keystore
        run: |
          mkdir -p ~/.android
          cp .github/debug.keystore ~/.android/debug.keystore

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: PureStatus-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
